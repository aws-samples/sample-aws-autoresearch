[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws_auto_research"
version = "0.1.0"
description = "AI Researcher runtime: researcher loop + pluggable experiment runners."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2,<3",
    "typer>=0.12",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock", "moto>=5,<6"]

[project.scripts]
aws-research = "aws_auto_research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["aws_auto_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
